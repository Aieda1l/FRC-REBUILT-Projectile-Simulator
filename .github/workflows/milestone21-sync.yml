name: One-shot Milestone 2.1 tree sync

on:
  push:
    branches:
      - milestone-2-rk45-3d-engine
    paths:
      - .github/workflows/milestone21-sync.yml

permissions:
  contents: write

jobs:
  sync-reviewed-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch reviewed source archive
        run: |
          curl -fsSL https://sb-39rjer01hxph.vercel.run/.sync/m21.tar.gz -o /tmp/m21.tar.gz
          echo "b9298f294f1537fc19b2432363c8ee681f79476597152057ca0a9ec583e50501  /tmp/m21.tar.gz" | sha256sum -c -
      - name: Replace source with reviewed archive
        run: |
          mkdir -p /tmp/m21
          tar -xzf /tmp/m21.tar.gz -C /tmp/m21
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/m21/. .
          git checkout HEAD -- .github/workflows
      - name: Commit reviewed Milestone 2.1 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Milestone 2.1 HUB geometry and 3-D UX"
          git push origin HEAD:milestone-2-rk45-3d-engine
